; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
extra_configs =
  local.ini

[env]
framework = arduino
upload_speed = 460800
monitor_speed = 115200
monitor_filters = send_on_enter, log2file, time, esp8266_exception_decoder
monitor_echo = true
monitor_eol = LF
board_build.filesystem = littlefs


[common]
lib_deps = 
  https://github.com/tzapu/WiFiManager.git
  mathertel/OneButton @ 2.5.0
  ArduinoJson
build_flags = 
  -D BUTTON_PIN=16 	; 按键引脚
  -D DEFAULT_API_URL=\"https://www.einktodo.com/api/display/v3\"
  -D FIRMWARE_UPDATE_URL=\"https://www.einktodo.com/api/update/firmware\"
	-D FILE_UPDATE_URL=\"https://www.einktodo.com/api/update\"
  ; HTTPS IP 兜底示例：
  ; -D FALLBACK_BASE_URL_1=\"https://107.173.82.8:16845\"
  ; -D FALLBACK_TLS_FINGERPRINT_1=\"AA BB CC DD EE FF 00 11 22 33 44 55 66 77 88 99 AA BB CC DD\"
  ; -D GDEW075Z08 	; Good Display 7.5 寸三色墨水屏 800*480

[env:production]
platform = espressif8266
board = esp12e
lib_deps = ${common.lib_deps}
build_flags =
  !echo '-D GIT_VERSION=\\"'$(git describe --tags --always --dirty)'\\"'
  -D ESP8266
  -D E_INK_750
  -D DEFAULT_API_URL=\"https://www.einktodo.com/api/display/v3\"
  -D FIRMWARE_UPDATE_URL=\"https://www.einktodo.com/api/update/firmware\"
	-D FILE_UPDATE_URL=\"https://www.einktodo.com/api/update\"
  -D BUTTON_PIN=16
  -D ENABLE_OTA=1

[env:preview]
platform = espressif8266
board = esp12e
lib_deps = ${common.lib_deps}
build_flags =
  !echo '-D GIT_VERSION=\\"'$(git describe --tags --always --dirty)'\\"'
  -D ESP8266
  -D E_INK_750
  -D DEFAULT_API_URL=\"https://preview.einktodo.com/api/display/v3\"
  -D FIRMWARE_UPDATE_URL=\"https://preview.einktodo.com/api/update/firmware\"
  -D FILE_UPDATE_URL=\"https://preview.einktodo.com/api/update\"
  -D BUTTON_PIN=16
  -D DEBUG=1
  -D ENABLE_OTA=1



